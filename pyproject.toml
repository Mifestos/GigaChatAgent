[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gigachat-agent"
version = "0.1.0"
description = "AI agent for safe, budgeted data analysis using GigaChat"
requires-python = ">=3.12" 

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"   